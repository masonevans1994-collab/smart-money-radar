name: analyze
on:
  workflow_dispatch:
  push:
    paths: [tools/analyze.py, radar/reaction.py, .github/workflows/analyze.yml]
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || format('Smart Money Radar {0}@users.noreply.github.com', github.repository_owner) }}
        run: PYTHONPATH=. python tools/analyze.py
      - uses: actions/upload-artifact@v4
        with: { name: reaction-report, path: public/reaction-report.json }
      - name: Save report to the 'screens' branch
        run: |
          mkdir -p /tmp/out && cp public/reaction-report.json /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b analysis
          git add . && git -c user.name="radar-bot" -c user.email="radar-bot@users.noreply.github.com" commit -qm "Reaction report"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" analysis
