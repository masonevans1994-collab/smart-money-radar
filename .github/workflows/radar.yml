# Free backend + phone app hosting on GitHub.
#
# Every run:
#   1. tests the Python radar
#   2. pulls live SEC Form 4 and House filings and writes signals.json
#   3. builds the Expo app for the web (opens on any phone)
#   4. publishes both to GitHub Pages:
#        https://<user>.github.io/smart-money-radar/            -> the app
#        https://<user>.github.io/smart-money-radar/signals.json -> the data feed
#
# Repo secrets (Settings > Secrets and variables > Actions):
#   SEC_USER_AGENT       "Your Name you@example.com" - unlocks SEC data
#   DISCORD_WEBHOOK_URL  optional, phone alerts via Discord
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID  optional, alerts via Telegram

name: radar

on:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes, 8am-7pm Eastern, Monday-Friday (UTC times).
    - cron: "*/30 12-23 * * 1-5"
    # Weekends: agencies rarely post, so a light check every 3 hours.
    - cron: "15 */3 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write   # only used to push review screenshots to the 'screens' branch
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Test radar
        run: python -m pytest -q

      # Filings never change once published; caching means each run only
      # downloads what's new.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-

      - name: Pull live data, update track record, send alerts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || format('Smart Money Radar {0}@users.noreply.github.com', github.repository_owner) }}
          PUBLISHED_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MIN_CONTRACT: ${{ vars.ALERT_MIN_CONTRACT }}
          ALERT_MIN_OTHER: ${{ vars.ALERT_MIN_OTHER }}
        run: |
          python -m radar --days 3 --max-filings 2500 \
            --out public/dashboard.html --json public/signals.json \
            --history public/history.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build phone app (web)
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx expo install react-dom react-native-web @expo/metro-runtime expo-font
          npx tsc --noEmit
          npm run test:logic
          npx expo export --platform web --output-dir dist
          cp -r dist/. ../public/
          python ../tools/pwa.py ../public /${{ github.event.repository.name }}
          cp ../tools/static/* ../public/

      - name: Check the app renders on a phone-size screen
        run: |
          mkdir -p /tmp/site && cp -r public /tmp/site/smart-money-radar
          (cd /tmp/site && python -m http.server 8080 >/dev/null 2>&1 &)
          cd tools && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium >/dev/null
          node smoke.mjs http://localhost:8080/smart-money-radar/
          mkdir -p /tmp/shots
          node shots.mjs http://localhost:8080/smart-money-radar/ /tmp/shots || echo "screenshots failed (not blocking)"

      - name: Save review screenshots to the 'screens' branch
        if: github.event_name != 'schedule'
        run: |
          [ -d /tmp/shots ] || exit 0
          cd /tmp/shots
          git init -q && git checkout -q -b screens
          git add . && git -c user.name="radar-bot" -c user.email="radar-bot@users.noreply.github.com" commit -qm "Review screenshots"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
